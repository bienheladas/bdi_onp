<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Flujo de datos ONP · fuentes e integraciones</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#1b1f27;color:#e6e6e6}
  #bar{padding:10px 16px;background:#11141a;border-bottom:1px solid #333;display:flex;
       gap:18px;align-items:center;flex-wrap:wrap}
  #bar h1{font-size:16px;margin:0 16px 0 0;font-weight:600}
  #net{width:100%;height:calc(100vh - 56px)}
  .leg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#bbb}
  .sw{width:13px;height:13px;border-radius:3px;display:inline-block}
  #tip{position:absolute;display:none;max-width:320px;background:#0c0f14;border:1px solid #4a5568;
       border-radius:6px;padding:9px 11px;font-size:12.5px;line-height:1.5;pointer-events:none;
       box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:10}
  input[type=range]{vertical-align:middle}
  label{font-size:13px;color:#cbd5e0}
  #cnt{font-size:12px;color:#8a93a2}
  #err{display:none;padding:20px;color:#f0a0a0}
</style></head><body>
<div id="bar">
  <h1>Flujo de datos ONP — fuentes e integraciones</h1>
  <span style="color:#6a8;font-size:11px">en vivo vs Postgres</span>
  <label>Peso mínimo del flujo: <b id="mv">1</b>
    <input id="mw" type="range" min="1" max="1" value="1"></label>
  <label><input id="he" type="checkbox"> solo flujos ≥2</label>
  <button id="relayout" style="background:#2d3748;color:#e6e6e6;border:1px solid #4a5568;
    border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px">Reacomodar</button>
  <button id="pin" style="background:#28506b;color:#e6e6e6;border:1px solid #4a7aa0;
    border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px">📌 Fijar vista</button>
  <button id="unpin" style="background:#2d3748;color:#cbd5e0;border:1px solid #4a5568;
    border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px">Restablecer</button>
  <span style="color:#667;font-size:11px">NODOS:</span>
  <span class="leg"><span class="sw" style="background:#C74634"></span>Oracle</span>
  <span class="leg"><span class="sw" style="background:#2B6CB0"></span>SQL Server</span>
  <span class="leg"><span class="sw" style="background:#2C7A7B"></span>DB2</span>
  <span class="leg"><span class="sw" style="background:#E8A33D"></span>Externa</span>
  <span class="leg"><span class="sw" style="background:#9E9E9E"></span>Archivo/Dataset</span>
  <span style="color:#667;font-size:11px">&nbsp;&nbsp;FLUJOS:</span>
  <span class="leg"><span class="sw" style="background:#38A169"></span>DataStage</span>
  <span class="leg"><span class="sw" style="background:#9F7AEA"></span>DB Link</span>
  <span class="leg"><span class="sw" style="background:#A0AEC0"></span>Ambos</span>
  <span id="cnt"></span>
</div>
<div id="net"></div><div id="tip"></div>
<div id="err"></div>
<script>
// Datos del flujo (mismo criterio que el artefacto ADI-05): si hay un snapshot
// embebido (copia offline del .zip) se usa; si no, se pide en vivo a Postgres.
(window.__FLUJO__
  ? Promise.resolve(window.__FLUJO__)
  : fetch('/api/flujo').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}))
  .then(DATA=>init(DATA))
  .catch(e=>{const el=document.getElementById('err');el.style.display='block';
    el.textContent='No se pudo cargar el flujo: '+e.message;});

function init(DATA){
const NODES=DATA.nodes, EDGES=DATA.edges, MAXW=DATA.maxw||1;
const mwEl=document.getElementById('mw'); mwEl.max=MAXW;
// Cuadros de tamaño uniforme (sin 'value'/scaling): eso inflaba el radio de recorte
// y dejaba las flechas a media linea. Asi el cuadro visible = borde donde termina la flecha.
const nodes=new vis.DataSet(NODES.map(n=>({id:n.id,label:n.label,shape:'box',
  color:{background:n.color,border:'#0008',highlight:{background:n.color,border:'#fff'}},
  font:{color:'#fff',size:14,face:'Segoe UI'},_tip:n.tip})));
// grosor acotado (max 6) y puntas chicas: edges muy anchos generaban puntas
// enormes que no llegaban al cuadro. arrowStrikethrough:false evita que la linea
// gruesa tape/empuje la punta.
const allEdges=EDGES.map((e,i)=>({id:i,from:e.from,to:e.to,value:e.value,
  arrows:{to:{enabled:e.arrowTo,scaleFactor:0.5},from:{enabled:e.arrowFrom,scaleFactor:0.5}},
  arrowStrikethrough:false, dashes:e.dashes,
  color:{color:e.color,highlight:'#f0c674',hover:'#f0c674',opacity:0.85},
  smooth:false,scaling:{min:1,max:6},_tip:e.tip,_w:e.value}));
const edges=new vis.DataSet(allEdges);
const net=new vis.Network(document.getElementById('net'),{nodes,edges},{
  layout:{randomSeed:7,improvedLayout:true},   // layout DETERMINISTA (mismo cada vez)
  nodes:{widthConstraint:{maximum:150}},
  edges:{scaling:{min:1,max:6}},
  physics:{barnesHut:{gravitationalConstant:-9000,springLength:150,springConstant:0.03,
    avoidOverlap:0.4},stabilization:{iterations:400},minVelocity:0.75},
  interaction:{hover:true,tooltipDelay:99999,navigationButtons:true,keyboard:true,dragNodes:true}});
window.net=net;
const VIEW_KEY='onp_flujo_view';
const SAVED=JSON.parse(localStorage.getItem(VIEW_KEY)||'null');
if(SAVED){ // restaurar posiciones + zoom/pan guardados (sin fisica); ignora nodos ya inexistentes
  net.setOptions({physics:false});
  nodes.update(Object.entries(SAVED.pos).filter(([id])=>nodes.get(id)).map(([id,p])=>({id,x:p.x,y:p.y})));
  net.moveTo({position:SAVED.view,scale:SAVED.scale});
}else{ // primera vez: acomoda, congela y ajusta el zoom
  net.once('stabilizationIterationsDone',()=>{net.setOptions({physics:false});net.fit();});
}
document.getElementById('relayout').onclick=()=>{
  net.setOptions({physics:true});
  net.once('stabilizationIterationsDone',()=>{net.setOptions({physics:false});net.fit();});
  net.stabilize();
};
document.getElementById('pin').onclick=()=>{
  localStorage.setItem(VIEW_KEY,JSON.stringify({pos:net.getPositions(),
    scale:net.getScale(),view:net.getViewPosition()}));
  const b=document.getElementById('pin');const o=b.textContent;
  b.textContent='✓ Vista fijada';setTimeout(()=>b.textContent=o,1500);
};
document.getElementById('unpin').onclick=()=>{localStorage.removeItem(VIEW_KEY);location.reload();};
// tooltip propio
const tip=document.getElementById('tip');
function show(html,x,y){tip.innerHTML=html;tip.style.display='block';
  tip.style.left=(x+14)+'px';tip.style.top=(y+14)+'px';}
function hide(){tip.style.display='none';}
net.on('hoverNode',p=>{const n=nodes.get(p.node);show(n._tip,p.pointer.DOM.x,p.pointer.DOM.y);});
net.on('hoverEdge',p=>{const ed=edges.get(p.edge);if(ed&&ed._tip){show(ed._tip,p.pointer.DOM.x,p.pointer.DOM.y);}});
net.on('blurNode',hide); net.on('blurEdge',hide);
net.on('dragStart',hide); net.on('zoom',hide);
document.getElementById('net').addEventListener('mouseleave',hide);
// filtro por peso
function applyFilter(min){
  edges.clear();
  edges.add(allEdges.filter(e=>e._w>=min));
  document.getElementById('cnt').textContent=
    `${edges.length} flujos visibles de ${allEdges.length}`;
}
const mw=document.getElementById('mw'),mv=document.getElementById('mv'),he=document.getElementById('he');
mw.oninput=()=>{mv.textContent=mw.value;he.checked=false;applyFilter(+mw.value);};
he.onchange=()=>{const m=he.checked?2:1;mw.value=m;mv.textContent=m;applyFilter(m);};
applyFilter(1);
}
</script></body></html>
