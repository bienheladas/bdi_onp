server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # API -> servicio 'api' (red interna del compose)
  location /api/ {
    proxy_pass http://api:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # SPA
  location / {
    try_files $uri /index.html;
  }
}
