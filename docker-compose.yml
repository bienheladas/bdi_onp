# Despliegue en Coolify (recurso "Docker Compose").
# Define en Coolify las variables: DATABASE_URL y ADMIN_PASSWORD.
# La API se une a la red externa 'coolify' para alcanzar el contenedor Postgres de ONP
# por su hostname interno (vfyn4fyx9lqwhd3tj87yjxze:5432).
services:
  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    expose:
      - "4100"
    networks:
      - default
      - coolify

  web:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      - api
    # Detrás de Traefik (Coolify). El dominio se asigna en la UI de Coolify y
    # Traefik enruta al puerto 80 del contenedor con HTTPS automatico (443).
    # NO declarar 'expose: 80' aqui: el Dockerfile ya hace EXPOSE 80. Declararlo
    # en ambos lados genera puertos ambiguos ({"80","80/tcp"}) y Traefik no sabe
    # a que puerto conectar -> 504. Con un solo puerto expuesto, autodetecta 80.
    networks:
      - default
      - coolify

networks:
  coolify:
    external: true
